env_id: intersection-v2
duration: 30
simulation_frequency: 15
policy_frequency: 5
spawn_probability: 0.6
initial_vehicle_count: 10
collision_reward: -10.0
arrived_reward: 5.0
high_speed_reward: 0.05
normalize_reward: false
reward_wrapper:
  type: RouteProgressReward
  progress_weight: 2.0
  time_penalty: 0.005
  arrival_distance: 25.0
  collision_first: true
predictive_safety_observation:
  horizon: 3.0
  margin: 0.5
  uncertainty_growth: 0.25
  clearance_scale: 10.0
  speed_scale: 9.0
  max_neighbors: 14
observation:
  type: Kinematics
  vehicles_count: 15
  features: [presence, x, y, vx, vy, cos_h, sin_h]
  absolute: false
  normalize: true
  order: sorted
  features_range:
    x: [-200, 200]
    y: [-200, 200]
    vx: [-80, 80]
    vy: [-80, 80]
action:
  type: DiscreteMetaAction
  longitudinal: true
  lateral: false
  target_speeds: [0, 4.5, 9]
